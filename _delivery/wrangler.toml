# Cloudflare Pages project for howyoureallywork.com: the static site plus the delivery
# Function in functions/api/download.js. No build step; the repo root is the site.
#
# Replace the two REPLACE_ values before connecting the repo to Cloudflare Pages.
# Secrets are never written here; set them with
#   npx wrangler pages secret put STRIPE_SECRET_KEY --project-name howyoureallywork
#   npx wrangler pages secret put R2_ACCESS_KEY_ID --project-name howyoureallywork
#   npx wrangler pages secret put R2_SECRET_ACCESS_KEY --project-name howyoureallywork

name = "howyoureallywork"
pages_build_output_dir = "."
compatibility_date = "2026-10-01"

# token:<token> -> purchase, session:<checkout session id> -> token
[[kv_namespaces]]
binding = "PURCHASES"
id = "REPLACE_WITH_KV_NAMESPACE_ID"

[vars]
R2_ACCOUNT_ID = "REPLACE_WITH_CLOUDFLARE_ACCOUNT_ID"
R2_BUCKET = "hyrw-book-files"
# Optional: only accept Checkout Sessions created by this Payment Link (plink_...).
STRIPE_PAYMENT_LINK = ""
